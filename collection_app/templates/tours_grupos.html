{% extends 'base.html' %}

    <div class="flex">
        <div class="rounded-lg p-4 bg-newlimes"> <!--Contenedor del form de cotizador-->            
                <form classa="flex rounded-lg text-black shadow-lg bg-transparent">
                    <h2 class="text-2xl font-bold text-black mb-4 py-5 px-10">Reservación</h2>
                    <div class="mb-4 ">
                        <label class="block mb-2 font-bold text-black" for="name">Nombre</label>
                        <input type="text" autocomplete="off" id="name" 
                        class="input input-bordered shadow-lg bg-transparent text-black w-full" placeholder="Nombre">
                    </div>
                    <div class="mb-4">
                        <label class="block text-black font-bold mb-2" for="people">Número de personas</label>
                        <input type="number" autocomplete="off" id="people" class="input input-bordered bg-transparent shadow-lg w-full" placeholder="Número de personas">
                    </div>
                    <div class="mb-4">
                        <label class="block text-black font-bold mb-2" for="date">Fecha</label>
                        <input type="date" autocomplete="off" id="date" class="input bg-transparent shadow-lg input-bordered w-full">
                    </div>
                    <div class="mb-4">
                        <label class="block text-black font-bold mb-2" for="service">Tipo de servicio</label>
                        <select id="service" class="select bg-transparent shadow-lg select-bordered w-full">
                            <option>Transporte</option>
                            <option>Tours</option>
                            <option>Hospedaje</option>
                        </select>
                    </div>
                    <button class="btn btn-primary w-full">Calcular</button>
                </form>
                <!-- Otros elementos -->
                <div class="mt-8 bg-lime p-6 rounded-lg shadow-lg">
                    <h3 class="text-2xl text-black font-bold mb-4">Te puede interesar</h3>
